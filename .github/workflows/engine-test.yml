name: engine-test

# Lint + Unit-Tests für die csa26-Engine. Läuft nur auf dem
# `engine`-Branch und auf PRs gegen ihn — `main` (Cppcheck-Wrapper,
# eingefroren) wird nicht belastet.

on:
  push:
    branches: [engine]
    paths:
      - 'engine/**'
      - '.github/workflows/engine-test.yml'
  pull_request:
    branches: [engine]
    paths:
      - 'engine/**'
      - '.github/workflows/engine-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Engine — Lint + Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest -v
