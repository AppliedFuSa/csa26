[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csa26"
version = "0.1.0"
description = "MISRA-C:2012 pre-audit GitHub Action wrapping Cppcheck + its MISRA addon."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Wolfgang Freese", email = "wolfgang@appliedfusa.de" },
]
keywords = ["misra", "misra-c", "cppcheck", "static-analysis", "iso26262", "embedded", "github-action"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
csa26-action = "csa26.action:main"

[project.urls]
Homepage = "https://github.com/AppliedFuSa/csa26"
Source = "https://github.com/AppliedFuSa/csa26"
Issues = "https://github.com/AppliedFuSa/csa26/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csa26 = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
